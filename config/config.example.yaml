# Copy to config.yaml and fill in your Bot Account credentials.
# config.yaml is gitignored and never committed.

risk_capital_xrp: 11254.0
risk_capital_rlusd: 0.0
risk_capital_unit: xrp
bot_account_address: ""
# Inbound RLUSD funding: send RLUSD to bot_account_address; trust line must use this issuer:
rlusd_issuer: ""
rlusd_issuer_mainnet: rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De
rlusd_issuer_testnet: rQhWct2fv4Vc4KRjRgMrxa8xPN9Zx9iLKV
bot_secret_key: ""

trading_pair: XRP-RLUSD
active_profile: safe
rlusd_currency: RLUSD

order_levels: 3
order_sizes:
  - 50.0
  - 15.0
  - 0.0
xrp_reserve: 12.0
min_order_size_xrp: 1.0
fund_with_xrp_only: true
base_spread: 0.0010
level_spread_increment: 0.0005

order_refresh_time_seconds: 60
tiered_refresh_enabled: true
rpc_failure_kill_streak: 6

dry_run: true
trading_enabled: true

# Trading Bot Alpha — Aggressive Bag Growth (deploy RLUSD into XRP on dips)
alpha_ws_enabled: true
alpha_max_slippage_pct: 0.50
alpha_weakness_deviation: 0.02   # trigger buys when 2% below XRP target (faster RLUSD deploy)
alpha_strength_deviation: 0.04
alpha_base_order_size_xrp: 50.0
alpha_bid_offset_pct: 0.02
alpha_ask_offset_pct: 0.02
# Phase 4 entry (conservative mainnet defaults)
alpha_risk_per_trade_pct: 0.5
alpha_min_edge_threshold_pct: 0.08
alpha_buy_limit_offset_pct: 0.15
alpha_sell_limit_offset_pct: 0.15
alpha_max_inventory_imbalance_pct: 0.10
alpha_max_pending_buys: 1
alpha_max_pending_sells: 1
alpha_stale_pending_buy_enabled: true
alpha_stale_pending_buy_max_drift_pct: 0.15  # cancel bids farther than ~buy_limit_offset from target
alpha_stale_pending_buy_max_age_seconds: 0   # 0 = off; e.g. 3600 to cancel bids older than 1h
alpha_deferred_sl_enabled: true            # hold SL off-ledger until price nears stop (XRPL-safe)
alpha_deferred_sl_arm_buffer_pct: 0.0        # arm SL when mid within this % above stop (0 = at/below stop)
alpha_cycle_interval_seconds: 15
alpha_rlusd_price_decimals: 2   # RLUSD/XRP order & HUD display precision (Market Conditions card)
# Re-entry after bracket TP/SL — wait for dip (TP) or stabilization (SL) before next buy
alpha_reentry_enabled: true
alpha_reentry_tp_dip_pct: 0.08
alpha_reentry_tp_cooldown_cycles: 4    # spread protection — wait before re-buy after TP
alpha_reentry_tp_cooldown_minutes: 0   # 0 = use cycles only; set e.g. 15 for time-based gate
alpha_reentry_sl_stabilization_pct: 0.12
alpha_reentry_sl_cooldown_cycles: 10   # longer patience after stop-loss
alpha_reentry_sl_cooldown_minutes: 0
alpha_reentry_tp_min_ta_score: 1.5
alpha_reentry_sl_min_ta_score: 2.5
# SL mitigations — breakeven/scratch stops, clustered exits, recovery, bid spacing
alpha_reentry_scratch_sl_max_loss_pct: 0.15   # loss from entry ≤ this % → scratch tier
alpha_reentry_scratch_sl_cooldown_cycles: 4   # short cooldown after scratch/breakeven SL
alpha_reentry_sl_cluster_window_seconds: 1800 # extra SLs in window do not reset timer (30 min)
alpha_reentry_recovery_enabled: true          # end SL cooldown early when price recovers
alpha_reentry_recovery_release_pct: 0.05      # mid this % above exit_mid triggers recovery
alpha_reentry_recovery_min_cycles: 2          # min cycles before recovery can apply
alpha_reentry_post_clear_buy_spacing_cycles: 5  # pause between bids after gate clears
alpha_ta_weight: 1.0   # 0=TA advisory (HUD display); 1=full buy gate at min_buy_score
alpha_breakout_pct: 0.02
alpha_structure_lookback: 20
alpha_structure_price_source: ask
alpha_chart_price_source: mid    # fullest history on Live chart
alpha_price_sample_interval_seconds: 15
alpha_price_history_max_samples: 32000
alpha_gui_refresh_seconds: 30
alpha_gui_bind_host: ""   # empty = hud_bind_host; use 0.0.0.0 on VPS for browser without SSH tunnel
alpha_skynet_enabled: true
alpha_skynet_grok_model: grok-3
alpha_skynet_grok_max_tokens: 4096   # SKYNET Grok response length (manual + agent)
# Phase 2 agent guardrails + enable toggle persist in logs/alpha_skynet_agent.json (HUD SKYNET tab).
# alpha_grok_api_key: ""   # optional; prefer XLG_GROK_KEY or XAI_API_KEY in .env

# PRO tab — replay analytics + auto-defensive circuit (treasury = placeholder)
alpha_defensive_circuit_enabled: true
alpha_defensive_window_hours: 14.0
alpha_defensive_sl_exit_threshold: 8
alpha_defensive_realized_loss_xrp: 3.0
alpha_defensive_min_exits: 4
alpha_defensive_auto_release_hours: 6.0
alpha_defensive_manual_release_hours: 2.0
alpha_defensive_recent_window_hours: 4.0
# Live tape participation — re-enter when mid/structure uptrend but 5m TA still bearish
alpha_tape_participation_enabled: true
alpha_tape_uptrend_drift_pct: 0.25
alpha_tape_near_mean_pct: 0.35
alpha_tape_bounce_from_low_pct: 0.12
alpha_tape_slope_samples: 8
alpha_tape_slope_min_lift_pct: 0.04
alpha_tape_participation_min_buy_factor: 0.9
alpha_tape_participation_max_sell_gap: 3.5
# Bull-run / breakout — bid when tape breaks out even if inventory is only mildly RLUSD-heavy
alpha_bull_run_enabled: true
alpha_bull_run_max_deviation: 0.02
alpha_bull_run_buy_offset_pct: 0.10
alpha_bull_run_near_high_pct: 0.06
# Accumulation regime — unified bull/breakout RLUSD deployment (default ON)
alpha_accumulation_regime_enabled: true
alpha_accumulation_require_bull_regime: false
alpha_accumulation_prime_on_bull_tape: true
alpha_accumulation_max_deviation: 0.04
alpha_accumulation_max_pending_buys: 3
alpha_accumulation_buy_offset_pct: 0.06
alpha_accumulation_stale_drift_pct: 0.08
alpha_accumulation_chase_fills: true
alpha_accumulation_min_edge_pct: 0.05
alpha_accumulation_risk_boost: 1.5
alpha_accumulation_ta_weight_factor: 0.75
alpha_accumulation_bypass_reentry: true
alpha_accumulation_bypass_reload_spacing: true
alpha_accumulation_reload_spacing_cycles: 1
alpha_accumulation_rlusd_budget_pct: 40.0
alpha_accumulation_budget_hours: 8.0
alpha_accumulation_early_arm_enabled: true
alpha_accumulation_chase_tighten_step_pct: 0.02
alpha_accumulation_chase_min_offset_pct: 0.03
alpha_accumulation_missed_move_pct: 0.30

# Bracket legs after buy fill (application-level OCO — not XRPL native)
initial_stop_loss_pct: 0.015
take_profit_pct: 0.03
take_profit_rr: 2.0
partial_fill_mode: wait_full
min_fill_size_xrp_for_oco: 0.5
bracket_trailing_enabled: false
trailing_step_pct: 1.5
breakout_confirmation_tf: "15m"

# Technical analysis — core buy gate when enabled (TA tab on HUD)
alpha_technical_analysis:
  enabled: true
  mode: scoring          # scoring | strict
  min_buy_score: 1.5
  min_sell_score: 1.0
  min_breakout_score: 1.5
  candle_interval_seconds: 300   # 5m OHLC default; HUD TA tab: 5m–2.5h (300–9000)
  candle_bucket_samples: 5       # legacy fallback when candle_interval_seconds is 0
  min_candles: 20
  candle_price_source: ask   # bid | ask | mid | last — long entry / bullish TA default
  sell_signal_price_source: bid  # bearish pattern reference (future asymmetric scoring)
  rsi:
    enabled: true
    period: 14
    oversold: 30
    overbought: 70
    buy_weight: 1.0
    sell_weight: 1.0
  stochastic:
    enabled: true
    k_period: 14
    d_period: 3
    smooth_k: 3
    oversold: 20
    overbought: 80
    buy_weight: 1.0
    sell_weight: 1.0
    breakout_weight: 1.0
  bollinger:
    enabled: true
    period: 20
    std_dev: 2.0
    squeeze_bandwidth_pct: 0.15
    buy_weight: 0.5
    sell_weight: 0.5
    breakout_weight: 1.5
  fibonacci:
    enabled: true
    lookback: 50
    levels: [0.382, 0.5, 0.618]
    proximity_pct: 0.25
    buy_weight: 1.0
    sell_weight: 1.0
  elliott_wave:
    enabled: true
    lookback: 30
    impulse_weight: 1.0
    corrective_weight: 0.5
  candle_streak:
    enabled: true
    min_green_streak: 3
    min_red_streak: 3
    buy_weight: 1.0
    sell_weight: 1.0
    breakout_weight: 0.5
  consolidation:
    enabled: true
    lookback: 8
    max_band_width_pct: 0.35
    penalty: 0.5
  pin_bar:
    enabled: true
    min_wick_body_ratio: 2.0
    buy_weight: 1.0
    sell_weight: 1.0
  engulfing:
    enabled: true
    buy_weight: 1.0
    sell_weight: 1.0
    breakout_weight: 1.0
  inside_bar:
    enabled: true
    buy_weight: 1.0
    sell_weight: 1.0
    breakout_weight: 1.5
  structure_bos:
    enabled: true
    lookback: 12
    buy_weight: 1.0
    sell_weight: 1.0
  order_block:
    enabled: true
    lookback: 20
    proximity_pct: 0.3
    buy_weight: 1.0
    sell_weight: 1.0
  fair_value_gap:
    enabled: true
    lookback: 30
    min_gap_pct: 0.05
    buy_weight: 1.0
    sell_weight: 0.5
  liquidity_grab:
    enabled: true
    lookback: 20
    wick_penetration_pct: 0.1
    buy_weight: 1.5
    sell_weight: 1.5

max_daily_drawdown_percent: 10.0
min_drawdown_percent: 2.0
max_drawdown_percent: 25.0
inventory_target_xrp_ratio: 0.75   # Aggressive Bag Growth — 75% XRP target
inventory_mode: rebalance   # directional value accumulation (not legacy market_make MM)
inventory_max_deviation: 0.12
inventory_hard_pause_deviation: 0.22
max_leg_size_pct_of_capital: 0.12
inventory_overshoot_slack: 0.03
edge_strictness: 1.0
# Solo L3 hard gate (crowded/sparse unchanged): pass if capture >= min_edge * mult OR >= floor
solo_edge_mult: 0.65
solo_edge_absolute_floor_pct: 0.012
dynamic_min_edge_enabled: true
book_pressure_sensitivity: 1.0
selective_order_refresh: true
order_price_tolerance_pct: 0.08
order_size_tolerance_xrp: 0.75
spread_failure_kill_cycles: 8
session_balance_loss_kill_xrp: 0.35
session_balance_loss_kill_min_fills: 25
toxic_fill_kill_enabled: false
toxic_fill_ratio_kill_threshold: 0.75
toxic_fill_min_count: 12
max_quote_worse_than_touch_pct: 0.50
competitive_off_touch_max_worse_pct: 0.12
max_quote_improve_touch_pct: 0.15
max_half_spread_from_mid_pct: 1.0
require_spread_validation_for_live: true
auto_profile_switching: false
auto_profile_inactivity_minutes: 30
auto_profile_confirm_cycles: 3
auto_profile_switch_cooldown_minutes: 45

telegram_enabled: false
telegram_token: ""          # Bot token from @BotFather
telegram_chat_id: ""        # Your numeric chat ID (message @userinfobot or /getUpdates)
telegram_notify_each_cycle: false
telegram_hud_url: ""          # Optional — public WS HUD for hourly report (e.g. http://YOUR_VPS:8765)
telegram_quiet_hours_enabled: false   # Skip hourly Telegram during window (UTC hours)
telegram_quiet_start_hour: 22         # Inclusive start (22 = 10pm UTC)
telegram_quiet_end_hour: 7            # Exclusive end (7 = 7am UTC)
hud_bind_host: "127.0.0.1"    # Set 0.0.0.0 on VPS when telegram_hud_url is public
hud_auth_enabled: false       # Auto-enables when bind is public and username+password are set
hud_auth_username: ""        # Or XLG_HUD_USERNAME in .env
hud_auth_password: ""         # Or XLG_HUD_PASSWORD in .env — use a strong password
hud_auth_rp_id: ""            # Optional WebAuthn rp_id (VPS IP or domain, no port)

# --- WS engine feature switches (ignored by legacy --mode engine) ---
ws_competitor_intel_enabled: true   # G1 scrape → G4; off saves RPC
ws_g2_scaler_enabled: true          # Toxic markout brake (size/spread)
ws_g4_peer_lane_enabled: true      # Peer-lane quoting bias (needs intel)
ws_drawdown_kill_enabled: true      # Daily drawdown → kill switch
ws_intel_log_enabled: true           # intel_decisions.jsonl
ws_fill_quality_enabled: true       # Markout tracking (G2 input)
ws_hud_enabled: true                # Production HUD :8765
ws_hud_metrics_enabled: true        # Metrics tab grades (off = lighter HUD)
ws_hud_grok_enabled: true           # HUD Grok /analyze_competitor
telegram_hourly_report_enabled: true   # Hourly Telegram soak summary
telegram_kill_alerts_enabled: true    # Telegram on drawdown kill

testnet: true
send_destination_default: ""
private_node_url: null
xrpl_testnet_rpc_url: https://s.altnet.rippletest.net:51234
xrpl_mainnet_rpc_url: https://s1.ripple.com:51234
