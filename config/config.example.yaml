# Copy to config.yaml and fill in your Bot Account credentials.
# config.yaml is gitignored and never committed.

risk_capital_xrp: 11254.0
risk_capital_rlusd: 0.0
risk_capital_unit: xrp
bot_account_address: ""
bot_secret_key: ""

trading_pair: XRP-RLUSD
active_profile: safe
rlusd_currency: RLUSD
rlusd_issuer: ""
rlusd_issuer_testnet: rQhWct2fv4Vc4KRjRgMrxa8xPN9Zx9iLKV
rlusd_issuer_mainnet: rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De

order_levels: 3
order_sizes:
  - 50.0
  - 15.0
  - 0.0
xrp_reserve: 12.0
min_order_size_xrp: 1.0
fund_with_xrp_only: true
base_spread: 0.0010
level_spread_increment: 0.0005

order_refresh_time_seconds: 60
tiered_refresh_enabled: true
rpc_failure_kill_streak: 6

dry_run: true
trading_enabled: true

max_daily_drawdown_percent: 10.0
min_drawdown_percent: 2.0
max_drawdown_percent: 25.0
inventory_target_xrp_ratio: 0.55
inventory_mode: market_make
inventory_max_deviation: 0.12
inventory_hard_pause_deviation: 0.22
max_leg_size_pct_of_capital: 0.12
inventory_overshoot_slack: 0.03
edge_strictness: 1.0
# Solo L3 hard gate (crowded/sparse unchanged): pass if capture >= min_edge * mult OR >= floor
solo_edge_mult: 0.65
solo_edge_absolute_floor_pct: 0.012
dynamic_min_edge_enabled: true
book_pressure_sensitivity: 1.0
selective_order_refresh: true
order_price_tolerance_pct: 0.08
order_size_tolerance_xrp: 0.75
spread_failure_kill_cycles: 8
session_balance_loss_kill_xrp: 0.35
session_balance_loss_kill_min_fills: 25
toxic_fill_kill_enabled: false
toxic_fill_ratio_kill_threshold: 0.75
toxic_fill_min_count: 12
max_quote_worse_than_touch_pct: 0.50
competitive_off_touch_max_worse_pct: 0.12
max_quote_improve_touch_pct: 0.15
max_half_spread_from_mid_pct: 1.0
require_spread_validation_for_live: true
auto_profile_switching: false
auto_profile_inactivity_minutes: 30
auto_profile_confirm_cycles: 3
auto_profile_switch_cooldown_minutes: 45

telegram_enabled: false
telegram_token: ""          # Bot token from @BotFather
telegram_chat_id: ""        # Your numeric chat ID (message @userinfobot or /getUpdates)
telegram_notify_each_cycle: false
telegram_hud_url: ""          # Optional — public WS HUD for hourly report (e.g. http://YOUR_VPS:8765)
telegram_quiet_hours_enabled: false   # Skip hourly Telegram during window (UTC hours)
telegram_quiet_start_hour: 22         # Inclusive start (22 = 10pm UTC)
telegram_quiet_end_hour: 7            # Exclusive end (7 = 7am UTC)
hud_bind_host: "127.0.0.1"    # Set 0.0.0.0 on VPS when telegram_hud_url is public
hud_auth_enabled: false       # Auto-enables when bind is public and username+password are set
hud_auth_username: ""        # Or XLG_HUD_USERNAME in .env
hud_auth_password: ""         # Or XLG_HUD_PASSWORD in .env — use a strong password
hud_auth_rp_id: ""            # Optional WebAuthn rp_id (VPS IP or domain, no port)

# --- WS engine feature switches (ignored by legacy --mode engine) ---
ws_competitor_intel_enabled: true   # G1 scrape → G4; off saves RPC
ws_g2_scaler_enabled: true          # Toxic markout brake (size/spread)
ws_g4_peer_lane_enabled: true      # Peer-lane quoting bias (needs intel)
ws_drawdown_kill_enabled: true      # Daily drawdown → kill switch
ws_intel_log_enabled: true           # intel_decisions.jsonl
ws_fill_quality_enabled: true       # Markout tracking (G2 input)
ws_hud_enabled: true                # Production HUD :8765
ws_hud_metrics_enabled: true        # Metrics tab grades (off = lighter HUD)
ws_hud_grok_enabled: true           # HUD Grok /analyze_competitor
telegram_hourly_report_enabled: true   # Hourly Telegram soak summary
telegram_kill_alerts_enabled: true    # Telegram on drawdown kill

testnet: true
send_destination_default: ""
private_node_url: null
xrpl_testnet_rpc_url: https://s.altnet.rippletest.net:51234
xrpl_mainnet_rpc_url: https://s1.ripple.com:51234
